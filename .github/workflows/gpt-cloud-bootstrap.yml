name: Build GPT Cloud bootstrap bundle

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-requests/current.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit SHA
        required: true
        type: string
      source_tree:
        description: Exact private source tree SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gpt-cloud-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: source-read
    steps:
      - name: Checkout trusted controller main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact bootstrap request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            test -f bootstrap-requests/current.json
            python3 - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          p=Path("bootstrap-requests/current.json")
          raw=p.read_bytes()
          d=json.loads(raw)
          assert d.get("source_repo")=="ewgenij87snwork/yevgeniy-sorokin"
          head=d.get("source_head",""); tree=d.get("source_tree","")
          assert re.fullmatch(r"[0-9a-f]{40}",head)
          assert re.fullmatch(r"[0-9a-f]{40}",tree)
          cert=d.get("source_recipient_cert_b64")
          enabled=bool(cert)
          if enabled:
              cert_bytes=base64.b64decode(cert,validate=True)
              Path(os.environ["RUNNER_TEMP"],"source-recipient.crt").write_bytes(cert_bytes)
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"SOURCE_SHA={head}\n")
              f.write(f"SOURCE_TREE={tree}\n")
              f.write(f"REQUEST_SHA256={hashlib.sha256(raw).hexdigest()}\n")
              f.write(f"SOURCE_BRIDGE_ENABLED={'true' if enabled else 'false'}\n")
          PY
            if [ "${SOURCE_BRIDGE_ENABLED:-}" = "true" ] || [ -f "${RUNNER_TEMP}/source-recipient.crt" ]; then
              openssl x509 -in "${RUNNER_TEMP}/source-recipient.crt" -noout -checkend 60
              recipient_sha="$(openssl x509 -in "${RUNNER_TEMP}/source-recipient.crt" -outform DER | sha256sum | awk '{print $1}')"
              echo "SOURCE_RECIPIENT_CERT_SHA256=${recipient_sha}" >> "${GITHUB_ENV}"
            fi
          else
            [[ "${INPUT_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${INPUT_SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]
            echo "SOURCE_SHA=${INPUT_SOURCE_SHA}" >> "${GITHUB_ENV}"
            echo "SOURCE_TREE=${INPUT_SOURCE_TREE}" >> "${GITHUB_ENV}"
            echo "REQUEST_SHA256=workflow-dispatch" >> "${GITHUB_ENV}"
            echo "SOURCE_BRIDGE_ENABLED=false" >> "${GITHUB_ENV}"
          fi

      - name: Mint short-lived read-only metadata token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PRIVATE_SOURCE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: ewgenij87snwork
          repositories: yevgeniy-sorokin
          permission-contents: read
          skip-token-revoke: true

      - name: Verify exact private identity, extract metadata, revoke token
        shell: bash
        env:
          GH_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          revoke() {
            curl --silent --show-error --fail-with-body               --request DELETE               --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               https://api.github.com/installation/token >/dev/null || true
          }
          trap revoke EXIT
          mkdir -p "${RUNNER_TEMP}/bootstrap-input"
          commit_json="${RUNNER_TEMP}/source-commit.json"
          curl --silent --show-error --fail-with-body             --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/ewgenij87snwork/yevgeniy-sorokin/git/commits/${SOURCE_SHA}"             --output "${commit_json}"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "${commit_json}")" = "${SOURCE_SHA}"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "${commit_json}")" = "${SOURCE_TREE}"
          for name in package.json package-lock.json; do
            curl --silent --show-error --fail-with-body --location               --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"               --header "Accept: application/vnd.github.raw+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/ewgenij87snwork/yevgeniy-sorokin/contents/${name}?ref=${SOURCE_SHA}"               --output "${RUNNER_TEMP}/bootstrap-input/${name}"
            test -s "${RUNNER_TEMP}/bootstrap-input/${name}"
          done
          sha256sum "${RUNNER_TEMP}/bootstrap-input/package.json" | awk '{print $1}' > "${RUNNER_TEMP}/package-json.sha256"
          sha256sum "${RUNNER_TEMP}/bootstrap-input/package-lock.json" | awk '{print $1}' > "${RUNNER_TEMP}/package-lock.sha256"
          test -s "${RUNNER_TEMP}/package-json.sha256"
          test -s "${RUNNER_TEMP}/package-lock.sha256"
          rm -f "${commit_json}"
          revoke
          trap - EXIT
          unset GH_SOURCE_TOKEN
          echo "PASS: exact private identity verified; only package metadata retained; token revoked"

      - name: Assert no private source checkout exists
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source
          test ! -e "${RUNNER_TEMP}/bootstrap-input/.git"
          test -f "${RUNNER_TEMP}/bootstrap-input/package.json"
          test -f "${RUNNER_TEMP}/bootstrap-input/package-lock.json"

      - name: Use exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Populate isolated exact npm cache without lifecycle scripts
        working-directory: ${{ runner.temp }}/bootstrap-input
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm cache verify
          node -e 'const p=require("./node_modules/@playwright/test/package.json"); process.stdout.write(p.version)' > "${RUNNER_TEMP}/playwright-version.txt"
          test -s "${RUNNER_TEMP}/playwright-version.txt"

      - name: Remove private package metadata before executing package code
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/bootstrap-input/package.json" "${RUNNER_TEMP}/bootstrap-input/package-lock.json"
          test ! -e "${RUNNER_TEMP}/bootstrap-input/package.json"
          test ! -e "${RUNNER_TEMP}/bootstrap-input/package-lock.json"

      - name: Populate pinned Playwright Chromium cache without credentials
        working-directory: ${{ runner.temp }}/bootstrap-input
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install chromium
          test -d "${PLAYWRIGHT_BROWSERS_PATH}"

      - name: Build source-free content-addressed bundle
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/gpt-cloud-bootstrap"
          mkdir -p "${out}/payload/node" "${out}/payload/npm-cache" "${out}/payload/ms-playwright"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "${node_root}/." "${out}/payload/node/"
          cp -a "${RUNNER_TEMP}/npm-cache/_cacache" "${out}/payload/npm-cache/"
          cp -a "${PLAYWRIGHT_BROWSERS_PATH}/." "${out}/payload/ms-playwright/"
          node_ver="$(node --version)"
          npm_ver="$(npm --version)"
          pw_ver="$(cat "${RUNNER_TEMP}/playwright-version.txt")"
          # Recover only the SHA-256 values captured before private package metadata deletion.
          test -f "${RUNNER_TEMP}/package-json.sha256"
          test -f "${RUNNER_TEMP}/package-lock.sha256"
          package_sha="$(cat "${RUNNER_TEMP}/package-json.sha256")"
          lock_sha="$(cat "${RUNNER_TEMP}/package-lock.sha256")"
          cat > "${out}/manifest.json" <<EOF
          {
            "schema": 2,
            "source_repo": "ewgenij87snwork/yevgeniy-sorokin",
            "source_head": "${SOURCE_SHA}",
            "source_tree": "${SOURCE_TREE}",
            "request_sha256": "${REQUEST_SHA256}",
            "package_lock_sha256": "${lock_sha}",
            "package_json_sha256": "${package_sha}",
            "controller_commit": "${GITHUB_SHA}",
            "node_version": "${node_ver}",
            "npm_version": "${npm_ver}",
            "playwright_version": "${pw_ver}",
            "platform": "linux-x64",
            "contents": ["node", "npm-cache", "ms-playwright"]
          }
          EOF
          tar -C "${out}" --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -czf "${RUNNER_TEMP}/gpt-cloud-bootstrap.tgz" manifest.json payload
          sha256sum "${RUNNER_TEMP}/gpt-cloud-bootstrap.tgz" > "${RUNNER_TEMP}/gpt-cloud-bootstrap.tgz.sha256"
          cp "${out}/manifest.json" "${RUNNER_TEMP}/gpt-cloud-bootstrap.manifest.json"
          mkdir -p "${RUNNER_TEMP}/gpt-cloud-bootstrap-chunks"
          split -b 60M -d -a 2 "${RUNNER_TEMP}/gpt-cloud-bootstrap.tgz" "${RUNNER_TEMP}/gpt-cloud-bootstrap-chunks/part-"
          chunk_count="$(find "${RUNNER_TEMP}/gpt-cloud-bootstrap-chunks" -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "${chunk_count}" -ge 1
          test "${chunk_count}" -le 8
          echo "chunk_count=${chunk_count}" >> "${GITHUB_ENV}"
          test ! -e "${out}/payload/source"
          test ! -e "${out}/payload/.git"
          echo "bundle_sha256=$(cut -d' ' -f1 "${RUNNER_TEMP}/gpt-cloud-bootstrap.tgz.sha256")" >> "${GITHUB_ENV}"

      - name: Upload bootstrap metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-meta
          path: |
            ${{ runner.temp }}/gpt-cloud-bootstrap.tgz.sha256
            ${{ runner.temp }}/gpt-cloud-bootstrap.manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload bootstrap chunk 00
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-00
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-00
          if-no-files-found: error
          retention-days: 3

      - name: Upload bootstrap chunk 01
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-01
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-01
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 02
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-02
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-02
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 03
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-03
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-03
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 04
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-04
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-04
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 05
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-05
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-05
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 06
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-06
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-06
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bootstrap chunk 07
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-bootstrap-${{ env.SOURCE_SHA }}-part-07
          path: ${{ runner.temp }}/gpt-cloud-bootstrap-chunks/part-07
          if-no-files-found: ignore
          retention-days: 3

      - name: Report digest only
        shell: bash
        run: echo "GPT cloud bootstrap SHA-256 ${bundle_sha256}; chunks=${chunk_count}"


      - name: Mint short-lived read-only source bridge token
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        id: source-bridge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PRIVATE_SOURCE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: ewgenij87snwork
          repositories: yevgeniy-sorokin
          permission-contents: read
          skip-token-revoke: true

      - name: Checkout exact private source for encrypted transport
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ewgenij87snwork/yevgeniy-sorokin
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ steps.source-bridge-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: private-source-bridge

      - name: Revoke source token, verify exact tree, archive tracked bytes
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        shell: bash
        env:
          GH_SOURCE_BRIDGE_TOKEN: ${{ steps.source-bridge-token.outputs.token }}
        run: |
          set -euo pipefail
          revoke() {
            curl --silent --show-error --fail-with-body               --request DELETE               --header "Authorization: Bearer ${GH_SOURCE_BRIDGE_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               https://api.github.com/installation/token >/dev/null || true
          }
          revoke
          unset GH_SOURCE_BRIDGE_TOKEN
          test "$(git -C private-source-bridge rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C private-source-bridge rev-parse 'HEAD^{tree}')" = "${SOURCE_TREE}"
          git -C private-source-bridge ls-files -z |             tar -C private-source-bridge --null -T -               --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner               -czf "${RUNNER_TEMP}/private-source.tar.gz"
          sha256sum "${RUNNER_TEMP}/private-source.tar.gz" | awk '{print $1}' > "${RUNNER_TEMP}/private-source.tar.gz.sha256"
          rm -rf private-source-bridge
          test ! -e private-source-bridge
          echo "PASS: source token revoked before archive; exact private tree archived; checkout deleted"

      - name: Encrypt source archive to ephemeral GPT cloud recipient
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/private-source.tar.gz"
          test -s "${RUNNER_TEMP}/source-recipient.crt"
          openssl cms -encrypt -binary -aes-256-gcm             -in "${RUNNER_TEMP}/private-source.tar.gz"             -out "${RUNNER_TEMP}/private-source.cms" -outform DER             "${RUNNER_TEMP}/source-recipient.crt"
          cipher_sha="$(sha256sum "${RUNNER_TEMP}/private-source.cms" | awk '{print $1}')"
          plain_sha="$(cat "${RUNNER_TEMP}/private-source.tar.gz.sha256")"
          cat > "${RUNNER_TEMP}/private-source-bridge.json" <<EOF
          {
            "schema": 1,
            "source_repo": "ewgenij87snwork/yevgeniy-sorokin",
            "source_head": "${SOURCE_SHA}",
            "source_tree": "${SOURCE_TREE}",
            "request_sha256": "${REQUEST_SHA256}",
            "recipient_cert_sha256": "${SOURCE_RECIPIENT_CERT_SHA256}",
            "plaintext_tar_sha256": "${plain_sha}",
            "ciphertext_sha256": "${cipher_sha}",
            "cipher": "CMS AES-256-GCM DER",
            "controller_commit": "${GITHUB_SHA}"
          }
          EOF
          rm -f "${RUNNER_TEMP}/private-source.tar.gz" "${RUNNER_TEMP}/source-recipient.crt"
          test ! -e "${RUNNER_TEMP}/private-source.tar.gz"
          mkdir -p "${RUNNER_TEMP}/private-source-chunks"
          split -b 50M -d -a 2 "${RUNNER_TEMP}/private-source.cms" "${RUNNER_TEMP}/private-source-chunks/part-"
          source_chunk_count="$(find "${RUNNER_TEMP}/private-source-chunks" -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "${source_chunk_count}" -ge 1
          test "${source_chunk_count}" -le 4
          echo "source_chunk_count=${source_chunk_count}" >> "${GITHUB_ENV}"

      - name: Upload encrypted source bridge metadata
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-source-${{ env.SOURCE_SHA }}-meta
          path: ${{ runner.temp }}/private-source-bridge.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload encrypted source chunk 00
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-source-${{ env.SOURCE_SHA }}-part-00
          path: ${{ runner.temp }}/private-source-chunks/part-00
          if-no-files-found: error
          retention-days: 1

      - name: Upload encrypted source chunk 01
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-source-${{ env.SOURCE_SHA }}-part-01
          path: ${{ runner.temp }}/private-source-chunks/part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload encrypted source chunk 02
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-source-${{ env.SOURCE_SHA }}-part-02
          path: ${{ runner.temp }}/private-source-chunks/part-02
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload encrypted source chunk 03
        if: env.SOURCE_BRIDGE_ENABLED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-source-${{ env.SOURCE_SHA }}-part-03
          path: ${{ runner.temp }}/private-source-chunks/part-03
          if-no-files-found: ignore
          retention-days: 1

      - name: Delete encrypted source working bytes
        if: always() && env.SOURCE_BRIDGE_ENABLED == 'true'
        shell: bash
        run: |
          rm -rf private-source-bridge "${RUNNER_TEMP}/private-source" "${RUNNER_TEMP}/private-source-chunks"
          rm -f "${RUNNER_TEMP}/private-source.cms" "${RUNNER_TEMP}/private-source.tar.gz" "${RUNNER_TEMP}/source-recipient.crt"
