name: Controller CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controller-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-gate:
    name: Controller trust gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare exact candidate without credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            test "${PR_HEAD_REPO}" = "${GITHUB_REPOSITORY}"
            [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
            mkdir -p /tmp/controller-candidate
            curl --fail --silent --show-error --location               "https://github.com/${GITHUB_REPOSITORY}/archive/${PR_HEAD_SHA}.tar.gz"               --output /tmp/controller-candidate.tar.gz
            tar -xzf /tmp/controller-candidate.tar.gz -C /tmp/controller-candidate --strip-components=1
            echo "CANDIDATE_ROOT=/tmp/controller-candidate" >> "${GITHUB_ENV}"
          else
            echo "CANDIDATE_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          fi

      - name: Run immutable trusted gate against candidate
        run: python3 tests/trusted_pr_gate.py "${CANDIDATE_ROOT}"

      - name: Run candidate unit tests as supplemental evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "${CANDIDATE_ROOT}"
          python3 -m unittest -v tests/test_release_controller.py tests/test_workflow_surface_gate.py
