name: Capture GPT Cloud network evidence

on:
  push:
    branches: [main]
    paths:
      - "network-requests/current.json"

permissions:
  contents: read

concurrency:
  group: gpt-cloud-network-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: source-read
    steps:
      - name: Checkout trusted controller main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact observation request
        shell: bash
        run: |
          set -euo pipefail
          test -f network-requests/current.json
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          p=Path("network-requests/current.json")
          raw=p.read_bytes(); d=json.loads(raw)
          assert d.get("schema")==1
          assert d.get("source_repo")=="ewgenij87snwork/yevgeniy-sorokin"
          head=d.get("source_head",""); tree=d.get("source_tree","")
          assert re.fullmatch(r"[0-9a-f]{40}",head)
          assert re.fullmatch(r"[0-9a-f]{40}",tree)
          cert=base64.b64decode(d["recipient_cert_b64"],validate=True)
          Path(os.environ["RUNNER_TEMP"],"recipient.crt").write_bytes(cert)
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"SOURCE_SHA={head}\nSOURCE_TREE={tree}\n")
              f.write(f"REQUEST_SHA256={hashlib.sha256(raw).hexdigest()}\n")
          PY
          openssl x509 -in "${RUNNER_TEMP}/recipient.crt" -noout -checkend 60
          cert_sha="$(openssl x509 -in "${RUNNER_TEMP}/recipient.crt" -outform DER | sha256sum | awk '{print $1}')"
          echo "RECIPIENT_CERT_SHA256=${cert_sha}" >> "${GITHUB_ENV}"

      - name: Mint short-lived read-only observation token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PRIVATE_SOURCE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: ewgenij87snwork
          repositories: yevgeniy-sorokin
          permission-contents: read
          skip-token-revoke: true

      - name: Verify exact identity, fetch minimal metadata, revoke token
        shell: bash
        env:
          GH_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          revoke() {
            curl --silent --show-error --fail-with-body --request DELETE               --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               https://api.github.com/installation/token >/dev/null || true
          }
          trap revoke EXIT
          in="${RUNNER_TEMP}/network-input"; mkdir -p "${in}"
          curl --silent --show-error --fail-with-body             --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/ewgenij87snwork/yevgeniy-sorokin/git/commits/${SOURCE_SHA}"             --output "${in}/commit.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "${in}/commit.json")" = "${SOURCE_SHA}"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"]["sha"])' "${in}/commit.json")" = "${SOURCE_TREE}"
          for path in package.json package-lock.json semantic/generated/public-contract.json; do
            mkdir -p "${in}/$(dirname "${path}")"
            curl --silent --show-error --fail-with-body --location               --header "Authorization: Bearer ${GH_SOURCE_TOKEN}"               --header "Accept: application/vnd.github.raw+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/ewgenij87snwork/yevgeniy-sorokin/contents/${path}?ref=${SOURCE_SHA}"               --output "${in}/${path}"
            test -s "${in}/${path}"
          done
          revoke; trap - EXIT; unset GH_SOURCE_TOKEN
          rm -f "${in}/commit.json"

      - name: Use exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Capture fresh npm advisory observations
        shell: bash
        run: |
          set -euo pipefail
          in="${RUNNER_TEMP}/network-input"; out="${RUNNER_TEMP}/network-evidence"
          mkdir -p "${out}"
          cd "${in}"
          set +e
          npm audit --json --audit-level=high > "${out}/npm-audit-full.json"
          full_rc=$?
          npm audit --json --audit-level=high --omit=dev > "${out}/npm-audit-omit-dev.json"
          omit_rc=$?
          set -e
          test "${full_rc}" -eq 0 -o "${full_rc}" -eq 1
          test "${omit_rc}" -eq 0 -o "${omit_rc}" -eq 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"network-evidence"
          for n in ["npm-audit-full.json","npm-audit-omit-dev.json"]:
              x=json.loads((root/n).read_text())
              assert isinstance(x,dict) and not x.get("error")
              v=x.get("metadata",{}).get("vulnerabilities",{})
              assert isinstance(v.get("high"),int) and isinstance(v.get("critical"),int)
              assert isinstance(x.get("vulnerabilities"),dict)
          PY

      - name: Capture fresh live HTTP observations
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'), path=require('path');
          const root=process.env.RUNNER_TEMP;
          const contract=JSON.parse(fs.readFileSync(path.join(root,'network-input/semantic/generated/public-contract.json'),'utf8'));
          const observations={schema:1,observed_at:new Date().toISOString(),canonical_origin:contract.canonical_origin,routes:[],sitemap:null,missing:null};
          const headers=o=>Object.fromEntries([...o.headers.entries()]);
          async function obs(method,p){
            const url=new URL(p,contract.canonical_origin);
            const r=await fetch(url,{method,redirect:'follow',signal:AbortSignal.timeout(15000),cache:'no-store'});
            const body=method==='HEAD'?'':await r.text();
            return {method,path:p,url:r.url,status:r.status,headers:headers(r),body};
          }
          for(const route of contract.routes){
            observations.routes.push({path:route.path,canonical_url:route.canonical_url,get:await obs('GET',route.path),head:await obs('HEAD',route.path)});
          }
          observations.sitemap=await obs('GET','/sitemap.xml');
          observations.missing=await obs('GET','/__quality_probe_missing__');
          fs.writeFileSync(path.join(root,'network-evidence/live-observations.json'),JSON.stringify(observations,null,2)+'\n');
          JS

      - name: Build and encrypt observation bundle
        shell: bash
        run: |
          set -euo pipefail
          in="${RUNNER_TEMP}/network-input"; out="${RUNNER_TEMP}/network-evidence"
          package_sha="$(sha256sum "${in}/package.json" | awk '{print $1}')"
          lock_sha="$(sha256sum "${in}/package-lock.json" | awk '{print $1}')"
          contract_sha="$(sha256sum "${in}/semantic/generated/public-contract.json" | awk '{print $1}')"
          full_sha="$(sha256sum "${out}/npm-audit-full.json" | awk '{print $1}')"
          omit_sha="$(sha256sum "${out}/npm-audit-omit-dev.json" | awk '{print $1}')"
          live_sha="$(sha256sum "${out}/live-observations.json" | awk '{print $1}')"
          cat > "${out}/manifest.json" <<EOF
          {
            "schema": 1,
            "source_repo": "ewgenij87snwork/yevgeniy-sorokin",
            "source_head": "${SOURCE_SHA}",
            "source_tree": "${SOURCE_TREE}",
            "request_sha256": "${REQUEST_SHA256}",
            "package_json_sha256": "${package_sha}",
            "package_lock_sha256": "${lock_sha}",
            "public_contract_sha256": "${contract_sha}",
            "npm_audit_full_sha256": "${full_sha}",
            "npm_audit_omit_dev_sha256": "${omit_sha}",
            "live_observations_sha256": "${live_sha}",
            "controller_commit": "${GITHUB_SHA}"
          }
          EOF
          tar -C "${out}" --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -czf "${RUNNER_TEMP}/network-evidence.tar.gz" manifest.json npm-audit-full.json npm-audit-omit-dev.json live-observations.json
          plain_sha="$(sha256sum "${RUNNER_TEMP}/network-evidence.tar.gz" | awk '{print $1}')"
          openssl cms -encrypt -binary -aes-256-gcm             -in "${RUNNER_TEMP}/network-evidence.tar.gz"             -out "${RUNNER_TEMP}/network-evidence.cms" -outform DER             "${RUNNER_TEMP}/recipient.crt"
          cipher_sha="$(sha256sum "${RUNNER_TEMP}/network-evidence.cms" | awk '{print $1}')"
          cat > "${RUNNER_TEMP}/network-evidence-bridge.json" <<EOF
          {
            "schema": 1,
            "source_head": "${SOURCE_SHA}",
            "source_tree": "${SOURCE_TREE}",
            "recipient_cert_sha256": "${RECIPIENT_CERT_SHA256}",
            "plaintext_tar_sha256": "${plain_sha}",
            "ciphertext_sha256": "${cipher_sha}",
            "cipher": "CMS AES-256-GCM DER",
            "controller_commit": "${GITHUB_SHA}"
          }
          EOF
          rm -rf "${in}" "${out}" "${RUNNER_TEMP}/network-evidence.tar.gz" "${RUNNER_TEMP}/recipient.crt"

      - name: Upload encrypted observation metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-network-evidence-${{ env.SOURCE_SHA }}-meta
          path: ${{ runner.temp }}/network-evidence-bridge.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload encrypted observation ciphertext
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gpt-cloud-network-evidence-${{ env.SOURCE_SHA }}-cipher
          path: ${{ runner.temp }}/network-evidence.cms
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup ciphertext working copy
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/network-input" "${RUNNER_TEMP}/network-evidence" "${RUNNER_TEMP}/network-evidence.tar.gz" "${RUNNER_TEMP}/network-evidence.cms" "${RUNNER_TEMP}/recipient.crt"
